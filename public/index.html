<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Saya - Marketplace</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="container">
            <div class="header-top">
                <h1>🛒 Toko Saya</h1>
                <div class="header-actions">
                    <span id="userDisplay">👤 Guest</span>
                    <button id="loginBtn" class="btn-secondary">Login</button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="container">
        <!-- Promo Banner -->
        <div id="promoBanner" class="promo-banner">
            <div class="promo-content">
                <i class="fas fa-tags"></i>
                <div>
                    <h3 id="promoTitle">Promo Spesial!</h3>
                    <p id="promoDesc">Gunakan kode promo untuk diskon</p>
                </div>
                <div class="promo-code-box">
                    <span id="promoCode">PROMO10</span>
                    <button id="copyPromoBtn"><i class="fas fa-copy"></i></button>
                </div>
            </div>
        </div>

        <!-- Products -->
        <h2 class="section-title">📦 Produk Kami</h2>
        <div id="productsContainer" class="products-grid">
            <div class="loading">Memuat produk...</div>
        </div>

        <!-- Promo Form -->
        <div class="promo-form">
            <h3>🎟️ Punya Kode Promo?</h3>
            <div class="promo-input-group">
                <input type="text" id="promoInput" placeholder="Masukkan kode promo...">
                <button id="applyPromoBtn" class="btn-primary">Gunakan</button>
            </div>
            <div id="promoResult"></div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>&copy; 2024 Toko Saya. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fas fa-home"></i> Beranda</a>
        <a href="#" class="nav-item"><i class="fas fa-search"></i> Cari</a>
        <a href="#" class="nav-item"><i class="fas fa-shopping-cart"></i> Keranjang <span class="badge" id="cartBadge">0</span></a>
        <a href="admin.html" class="nav-item"><i class="fas fa-user-cog"></i> Admin</a>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
